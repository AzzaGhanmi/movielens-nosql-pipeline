# MovieLens NoSQL pipeline - services started with: docker compose up -d

services:

  mongo:
    image: mongo:7.0
    container_name: movielens_mongo
    ports:
      - "27018:27017"              # 27017 is already used by another local container
    volumes:
      - mongo_data:/data/db        # database files, kept even if the container is removed
      - ./data:/data/import:ro     # project data folder, read-only inside the container
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10

  cassandra:
    image: cassandra:5.0
    container_name: movielens_cassandra
    ports:
      - "9042:9042"                # CQL port: cqlsh and Python drivers connect here
    environment:
      - MAX_HEAP_SIZE=1G           # memory limit for Cassandra (the PC has 16 GB)
      - HEAP_NEWSIZE=256M
    volumes:
      - cassandra_data:/var/lib/cassandra   # database files, kept even if the container is removed
      - ./data:/data/import:ro              # prepared CSV files, read-only
      - ./cassandra:/cassandra:ro           # CQL scripts of the project, read-only
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 60s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.24
    container_name: movielens_elasticsearch
    ports:
      - "9200:9200"                # REST API: Kibana, curl and Python connect here
    environment:
      - discovery.type=single-node         # one node only, no cluster to join
      - xpack.security.enabled=false       # no password or HTTPS (local school project only)
      - ES_JAVA_OPTS=-Xms1g -Xmx1g         # memory limit for Elasticsearch
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.24   # must be the same version as Elasticsearch
    container_name: movielens_kibana
    ports:
      - "5601:5601"                # web interface: http://localhost:5601
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy   # start Kibana only when Elasticsearch is ready

  transfer:
    build: .                       # image built from the Dockerfile of the project
    container_name: movielens_transfer
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - CASSANDRA_HOST=cassandra
      - ES_URL=http://elasticsearch:9200
    depends_on:                    # run only when the three databases are ready
      mongo:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

volumes:
  mongo_data:
  cassandra_data:
  es_data: